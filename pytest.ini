[pytest]
testpaths = tests
# Put the repo root on sys.path. Without this only `python -m pytest` works
# (that form implicitly prepends the working directory); the bare `pytest`
# console script does not, so `import rtcqr` fails at collection. Relative
# to rootdir, so it holds no matter which directory pytest is invoked from.
# Requires pytest >= 7.0, which requirements.txt pins.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:pandas.*
